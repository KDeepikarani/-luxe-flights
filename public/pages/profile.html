<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profile — Luxe Flights</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="particles" class="bg-particles"></div>
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="sidebar-overlay" id="sb-overlay" onclick="toggleSidebar()"></div>
  <div class="main">
    <div class="page-header" id="page-header">
      <div><div class="page-title">My Profile</div></div>
    </div>
    <div class="page-body fade-in">
      <div style="background:linear-gradient(135deg,rgba(201,168,76,0.1),rgba(56,189,248,0.05));border:1px solid rgba(201,168,76,0.2);border-radius:20px;padding:28px 32px;display:flex;align-items:center;gap:22px;margin-bottom:28px;flex-wrap:wrap">
        <div id="profAvatar" style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold3));display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#060610;border:3px solid rgba(201,168,76,0.4);flex-shrink:0"></div>
        <div style="flex:1">
          <div style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700" id="profName">—</div>
          <div style="color:var(--text3);font-size:14px" id="profEmail">—</div>
          <div style="margin-top:8px" id="profRole"></div>
        </div>
        <div style="text-align:right">
          <div style="font-size:11px;color:var(--text3)">MEMBER SINCE</div>
          <div id="profSince" style="font-size:14px;margin-bottom:8px">—</div>
          <div style="font-size:11px;color:var(--text3)">LAST LOGIN</div>
          <div id="profLogin" style="font-size:13px">—</div>
        </div>
      </div>

      <div class="g g-2">
        <div class="card">
          <h3 style="font-size:16px;margin-bottom:20px">Personal Information</h3>
          <form id="profForm">
            <div class="form-group"><label class="form-label">Full Name</label><input type="text" id="pName" class="form-input" required></div>
            <div class="form-group"><label class="form-label">Phone</label><input type="tel" id="pPhone" class="form-input"></div>
            <div class="form-group"><label class="form-label">Avatar URL</label><input type="url" id="pAvatar" class="form-input" placeholder="https://..."></div>
            <button type="submit" class="btn btn-gold" id="saveBtn">Save Changes</button>
          </form>
        </div>
        <div class="card">
          <h3 style="font-size:16px;margin-bottom:20px">Change Password</h3>
          <form id="passForm">
            <div class="form-group"><label class="form-label">Current Password</label><input type="password" id="curPass" class="form-input" placeholder="••••••••" required></div>
            <div class="form-group"><label class="form-label">New Password</label><input type="password" id="newPass" class="form-input" placeholder="Min. 6 characters" required></div>
            <div class="form-group"><label class="form-label">Confirm New Password</label><input type="password" id="conPass" class="form-input" placeholder="Repeat" required></div>
            <button type="submit" class="btn btn-ghost" id="passBtn">Update Password</button>
          </form>
          <div style="margin-top:28px;padding-top:20px;border-top:1px solid var(--border)">
            <button class="btn btn-red btn-sm" onclick="if(confirm('Sign out?'))doLogout()">⏻ Sign Out</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="toast-root" class="toasts"></div>
<script src="/js/app.js"></script>
<script>
if(!requireAuth()) location.href='/login';
buildSidebar(API.isAdmin()?'admin':'profile');

async function loadProf(){
  const {ok,data}=await API.get('/auth/me');
  if(!ok) return;
  const u=data.user;
  document.getElementById('profName').textContent=u.name;
  document.getElementById('profEmail').textContent=u.email;
  document.getElementById('profRole').innerHTML=`<span class="badge ${u.role==='admin'?'b-economy':'b-confirmed'}">${u.role==='admin'?'👑 Admin':'✦ Member'}</span>`;
  document.getElementById('profSince').textContent=fmt.date(u.createdAt);
  document.getElementById('profLogin').textContent=u.lastLogin?fmt.datetime(u.lastLogin):'First login';
  const av=document.getElementById('profAvatar');
  av.textContent=u.avatar?'':u.name.charAt(0).toUpperCase();
  if(u.avatar) av.innerHTML=`<img src="${u.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover" onerror="this.parentElement.textContent='${u.name.charAt(0)}'">`;
  document.getElementById('pName').value=u.name||'';
  document.getElementById('pPhone').value=u.phone||'';
  document.getElementById('pAvatar').value=u.avatar||'';
  API.setAuth(API.token(),u);
}

document.getElementById('profForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('saveBtn'); btn.disabled=true; btn.innerHTML='<span class="loader"></span>';
  const {ok,data}=await API.put('/auth/profile',{name:document.getElementById('pName').value,phone:document.getElementById('pPhone').value,avatar:document.getElementById('pAvatar').value});
  btn.disabled=false; btn.innerHTML='Save Changes';
  if(ok){Toast.show('Profile updated!','success');API.setAuth(API.token(),data.user);loadProf();}
  else Toast.show(data.message||'Failed','error');
});

document.getElementById('passForm').addEventListener('submit',async e=>{
  e.preventDefault();
  if(document.getElementById('newPass').value!==document.getElementById('conPass').value){Toast.show('Passwords do not match','error');return;}
  const btn=document.getElementById('passBtn'); btn.disabled=true; btn.innerHTML='<span class="loader"></span>';
  const {ok,data}=await API.put('/auth/change-password',{currentPassword:document.getElementById('curPass').value,newPassword:document.getElementById('newPass').value});
  btn.disabled=false; btn.innerHTML='Update Password';
  if(ok){Toast.show('Password updated!','success');document.getElementById('passForm').reset();}
  else Toast.show(data.message||'Failed','error');
});

loadProf();
</script>
</body>
</html>
