<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Register — Luxe Flights</title>
<link rel="stylesheet" href="/css/styles.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;background:var(--bg);}
.reg-wrap{width:100%;max-width:520px;animation:slideUp 0.5s ease;}
.reg-card{background:var(--bg2);border:1px solid var(--border);border-radius:22px;padding:48px 44px;}
.strength{height:3px;border-radius:2px;background:var(--border);margin-top:7px;overflow:hidden;}
.strength-fill{height:100%;border-radius:2px;transition:width 0.3s,background 0.3s;width:0;}
</style>
</head>
<body>
<div id="particles" class="bg-particles"></div>
<div class="reg-wrap">
  <a href="/login" style="display:inline-flex;align-items:center;gap:6px;color:var(--text3);font-size:13px;margin-bottom:24px;transition:var(--transition);" onmouseover="this.style.color='var(--gold2)'" onmouseout="this.style.color='var(--text3)'">← Back to sign in</a>
  <div class="reg-card">
    <div style="text-align:center;margin-bottom:32px">
      <div style="font-size:36px;margin-bottom:8px">✈</div>
      <h1 style="font-size:30px;margin-bottom:6px">Create Account</h1>
      <p style="color:var(--text3);font-size:14px">Join Luxe Flights for premium travel</p>
    </div>

    <form id="regForm">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="name" class="form-input" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" id="phone" class="form-input" placeholder="+91 9876543210">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Min. 6 characters" required oninput="checkStrength(this.value)">
        <div class="strength"><div class="strength-fill" id="sBar"></div></div>
        <div id="sLabel" style="font-size:11px;color:var(--text3);margin-top:4px"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" id="confirm" class="form-input" placeholder="Repeat password" required>
      </div>
      <button type="submit" class="btn btn-gold" style="width:100%;justify-content:center;margin-top:4px" id="regBtn">Create Account</button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:14px;color:var(--text3)">
      Already have an account? <a href="/login" style="color:var(--gold2)">Sign in</a>
    </p>
  </div>
</div>

<div id="toast-root" class="toasts"></div>
<script src="/js/app.js"></script>
<script>
if(API.isAuth()) location.href='/dashboard';

function checkStrength(v){
  const bar=document.getElementById('sBar'),lbl=document.getElementById('sLabel');
  let s=0;
  if(v.length>=6)s++; if(v.length>=10)s++; if(/[A-Z]/.test(v))s++; if(/[0-9]/.test(v))s++; if(/[^A-Za-z0-9]/.test(v))s++;
  const c=['','#ef4444','#f97316','#eab308','#10b981'];
  const l=['','Weak','Fair','Good','Strong'];
  const idx=Math.min(s,4);
  bar.style.width=(idx*25)+'%'; bar.style.background=c[idx]; lbl.textContent=l[idx]; lbl.style.color=c[idx];
}

document.getElementById('regForm').addEventListener('submit', async e => {
  e.preventDefault();
  if(document.getElementById('password').value !== document.getElementById('confirm').value){
    Toast.show('Passwords do not match','error'); return;
  }
  const btn=document.getElementById('regBtn');
  btn.disabled=true; btn.innerHTML='<span class="loader"></span> Creating...';
  const {ok,data} = await API.post('/auth/register',{
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
    phone: document.getElementById('phone').value
  });
  if(ok){
    API.setAuth(data.token,data.user);
    Toast.show('Account created! Welcome aboard ✈','success');
    setTimeout(()=>location.href='/dashboard',800);
  } else {
    Toast.show(data.message||'Registration failed','error');
    btn.disabled=false; btn.innerHTML='Create Account';
  }
});
</script>
</body>
</html>
