<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Track Flight — Luxe Flights</title>
<link rel="stylesheet" href="/css/styles.css">
<style>
.track-map{background:linear-gradient(135deg,var(--surface2),var(--bg3));border:1px solid var(--border);border-radius:16px;padding:40px;text-align:center;position:relative;overflow:hidden;min-height:200px;}
.plane-path{position:relative;height:60px;display:flex;align-items:center;}
.path-line{flex:1;height:2px;background:linear-gradient(90deg,var(--border),var(--gold),var(--border));border-radius:1px;}
.plane-icon{font-size:32px;position:absolute;animation:trackPlane 4s ease-in-out infinite;}
@keyframes trackPlane{0%,100%{left:10%;transform:rotate(-10deg);}50%{left:80%;transform:rotate(10deg);}}
.info-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px;}
.info-row:last-child{border-bottom:none;}
.status-bar-wrap{background:var(--surface2);border-radius:8px;overflow:hidden;height:10px;margin:12px 0;}
.status-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--teal));border-radius:8px;transition:width 1s ease;}
</style>
</head>
<body>
<div id="particles" class="bg-particles"></div>
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="sidebar-overlay" id="sb-overlay" onclick="toggleSidebar()"></div>
  <div class="main">
    <div class="page-header" id="page-header">
      <div><div class="page-title">Track Flight</div><div class="page-sub">Real-time flight status and journey tracker</div></div>
    </div>
    <div class="page-body fade-in">

      <!-- Search -->
      <div class="card" style="margin-bottom:24px">
        <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
          <div class="form-group" style="flex:1;margin:0;min-width:200px">
            <label class="form-label">Booking Reference or Flight Number</label>
            <input type="text" id="trackInput" class="form-input" placeholder="e.g. LX1A2B3C or LX101" value="">
          </div>
          <button class="btn btn-gold" onclick="doTrack()" style="height:46px;padding:0 28px">🔍 Track</button>
        </div>
      </div>

      <div id="trackResult"></div>
    </div>
  </div>
</div>
<div id="toast-root" class="toasts"></div>
<script src="/js/app.js"></script>
<script>
if(!requireAuth()) location.href='/login';
buildSidebar('Track Flight');

// Pre-fill from URL
const urlRef=new URLSearchParams(location.search).get('ref');
if(urlRef){ document.getElementById('trackInput').value=urlRef; doTrack(); }

async function doTrack(){
  const val=document.getElementById('trackInput').value.trim().toUpperCase();
  if(!val){ Toast.show('Please enter a booking ref or flight number','error'); return; }
  const el=document.getElementById('trackResult');
  el.innerHTML='<div class="plane-loader" style="padding:60px"></div>';

  // Try booking ref first
  const {ok,data}=await API.get('/bookings');
  if(!ok){ el.innerHTML='<div class="empty"><div class="empty-icon">✈</div><div class="empty-title">Error loading data</div></div>'; return; }

  const booking=data.bookings?.find(b=>b.bookingRef===val||(b.flightId?.flightNumber||'').toUpperCase()===val);
  if(!booking){
    el.innerHTML=`<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">Not found</div><div class="empty-text">No booking found with reference "${val}"<br>Please check and try again</div></div>`;
    return;
  }

  const f=booking.flightId||{};
  const now=new Date();
  const flightDate=new Date(f.date||booking.createdAt);
  const depTime=f.departureTime||'00:00';
  const [dh,dm]=depTime.split(':').map(Number);
  flightDate.setHours(dh,dm,0);
  const arrTime=f.arrivalTime||'01:00';
  const [ah,am]=arrTime.split(':').map(Number);
  const arrDate=new Date(flightDate);
  arrDate.setHours(ah,am,0);

  const totalDur=arrDate-flightDate;
  const elapsed=Math.max(0,Math.min(now-flightDate,totalDur));
  const pct=totalDur>0?Math.round((elapsed/totalDur)*100):0;

  let statusLabel='', statusColor='', statusBadge='';
  if(booking.status==='cancelled'){ statusLabel='Cancelled'; statusColor='var(--red2)'; statusBadge='b-cancelled'; }
  else if(now<flightDate){ statusLabel='Scheduled'; statusColor='var(--gold2)'; statusBadge='b-pending'; }
  else if(now>=flightDate&&now<arrDate){ statusLabel='In Flight ✈'; statusColor='var(--sky2)'; statusBadge='b-processing'; }
  else { statusLabel='Landed'; statusColor='var(--green2)'; statusBadge='b-confirmed'; }

  el.innerHTML=`
    <div class="card" style="margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px">
        <div>
          <div style="font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700">${f.from?.code||'?'} → ${f.to?.code||'?'}</div>
          <div style="font-size:13px;color:var(--text3);margin-top:4px">${f.airline||''} ${f.flightNumber||''} · Ref: ${booking.bookingRef}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:13px;color:var(--text3);margin-bottom:6px">STATUS</div>
          <div style="font-size:18px;font-weight:600;color:${statusColor}">${statusLabel}</div>
        </div>
      </div>

      <div class="track-map">
        <div style="display:flex;justify-content:space-between;margin-bottom:16px">
          <div style="text-align:left"><div style="font-size:28px;font-weight:700;color:var(--gold2)">${f.from?.code||'?'}</div><div style="font-size:12px;color:var(--text3)">${f.from?.city||''}</div><div style="font-size:16px;font-weight:600">${f.departureTime||''}</div></div>
          <div style="text-align:center;align-self:center;font-size:12px;color:var(--text3)">${f.duration||''}</div>
          <div style="text-align:right"><div style="font-size:28px;font-weight:700;color:var(--gold2)">${f.to?.code||'?'}</div><div style="font-size:12px;color:var(--text3)">${f.to?.city||''}</div><div style="font-size:16px;font-weight:600">${f.arrivalTime||''}</div></div>
        </div>
        <div class="plane-path">
          <div class="path-line"></div>
          ${booking.status!=='cancelled'&&now>=flightDate&&now<arrDate?'<div class="plane-icon">✈</div>':''}
        </div>
        <div class="status-bar-wrap"><div class="status-bar" style="width:${booking.status==='cancelled'?0:pct}%"></div></div>
        <div style="font-size:12px;color:var(--text3);margin-top:8px">${booking.status==='cancelled'?'Booking Cancelled':pct===0?'Flight not yet departed':pct>=100?'Flight completed':'Flight in progress — '+pct+'% complete'}</div>
      </div>
    </div>

    <div class="g g-2">
      <div class="card">
        <h3 style="font-size:16px;margin-bottom:16px">Flight Details</h3>
        <div class="info-row"><span style="color:var(--text3)">Flight Number</span><span>${f.flightNumber||'—'}</span></div>
        <div class="info-row"><span style="color:var(--text3)">Airline</span><span>${f.airline||'—'}</span></div>
        <div class="info-row"><span style="color:var(--text3)">Date</span><span>${fmt.date(f.date)}</span></div>
        <div class="info-row"><span style="color:var(--text3)">Departure</span><span>${f.departureTime||'—'} (${f.from?.city||''})</span></div>
        <div class="info-row"><span style="color:var(--text3)">Arrival</span><span>${f.arrivalTime||'—'} (${f.to?.city||''})</span></div>
        <div class="info-row"><span style="color:var(--text3)">Duration</span><span>${f.duration||'—'}</span></div>
        <div class="info-row"><span style="color:var(--text3)">Class</span><span>${booking.class}</span></div>
        <div class="info-row"><span style="color:var(--text3)">Baggage</span><span>${f.baggage||'20kg'}</span></div>
      </div>
      <div class="card">
        <h3 style="font-size:16px;margin-bottom:16px">Booking Details</h3>
        <div class="info-row"><span style="color:var(--text3)">Booking Ref</span><span style="font-family:monospace">${booking.bookingRef}</span></div>
        <div class="info-row"><span style="color:var(--text3)">Passengers</span><span>${booking.passengers?.length||1}</span></div>
        <div class="info-row"><span style="color:var(--text3)">Total Paid</span><span style="color:var(--gold2)">${fmt.currency(booking.totalAmount)}</span></div>
        <div class="info-row"><span style="color:var(--text3)">Payment</span><span>${booking.paymentMethod}</span></div>
        <div class="info-row"><span style="color:var(--text3)">Contact Email</span><span style="font-size:12px">${booking.contactEmail}</span></div>
        <div class="info-row"><span style="color:var(--text3)">Status</span><span class="badge b-${booking.status}">${booking.status}</span></div>
        <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
          ${booking.status==='confirmed'?`<button class="btn btn-red btn-sm" onclick="location.href='/my-bookings'">↩ Cancel Booking</button>`:''}
          <button class="btn btn-sky btn-sm" onclick="location.href='/support'">💬 Get Help</button>
        </div>
      </div>
    </div>`;
}
</script>
</body>
</html>
